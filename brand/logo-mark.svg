<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foilGradient" x1="10" y1="10" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C05CF5"/>
      <stop offset="50%" stop-color="#8A5DE8"/>
      <stop offset="100%" stop-color="#2FD4DE"/>
    </linearGradient>
    <radialGradient id="sheen" cx="28%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- passport chip base -->
  <rect x="20" y="20" width="200" height="200" rx="52" fill="url(#foilGradient)"/>
  <rect x="20" y="20" width="200" height="200" rx="52" fill="url(#sheen)"/>

  <!-- stamp perforation ring -->
  <rect x="30" y="30" width="180" height="180" rx="44" fill="none"
        stroke="#F0C868" stroke-width="2.5" stroke-dasharray="3 7" opacity="0.8"/>

  <!-- EMV chip motif -->
  <g opacity="0.92">
    <rect x="50" y="52" width="48" height="36" rx="7" fill="none" stroke="#F0C868" stroke-width="4"/>
    <line x1="66" y1="52" x2="66" y2="88" stroke="#F0C868" stroke-width="3.5"/>
    <line x1="82" y1="52" x2="82" y2="88" stroke="#F0C868" stroke-width="3.5"/>
    <line x1="50" y1="70" x2="98" y2="70" stroke="#F0C868" stroke-width="3.5"/>
  </g>

  <!-- stamped verification check -->
  <g transform="rotate(-8 138 140)">
    <path d="M 96 142 L 126 172 L 190 100"
          fill="none" stroke="#F0C868" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>